name: Build Installers & Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Setup & Portable Zip
    runs-on: windows-latest
    steps:
      - name: Checkout PyMORGAN
        uses: actions/checkout@v4
        with:
          path: PyMORGAN

      - name: Checkout PyRATE-TA
        uses: actions/checkout@v4
        with:
          repository: RJFernandezTeran/PyRATE-TA
          path: PyRATE-TA

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Installer & Portable Zip
        working-directory: PyMORGAN
        run: uv run python scripts/build_installer.py --platform windows

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pymorgan-suite-windows
          path: PyMORGAN/dist_installer/*

  build-macos:
    name: macOS DMG & App Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout PyMORGAN
        uses: actions/checkout@v4
        with:
          path: PyMORGAN

      - name: Checkout PyRATE-TA
        uses: actions/checkout@v4
        with:
          repository: RJFernandezTeran/PyRATE-TA
          path: PyRATE-TA

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Make Scripts Executable
        run: chmod +x PyMORGAN/installer/build_macos.sh

      - name: Build macOS DMG & App
        working-directory: PyMORGAN
        run: uv run python scripts/build_installer.py --platform macos

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pymorgan-suite-macos
          path: PyMORGAN/dist_installer/*

  build-linux:
    name: Linux Tarball & Desktop Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PyMORGAN
        uses: actions/checkout@v4
        with:
          path: PyMORGAN

      - name: Checkout PyRATE-TA
        uses: actions/checkout@v4
        with:
          repository: RJFernandezTeran/PyRATE-TA
          path: PyRATE-TA

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Linux Dependencies for Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libegl1-mesa

      - name: Make Scripts Executable
        run: |
          chmod +x PyMORGAN/installer/build_linux.sh
          chmod +x PyMORGAN/installer/assets/linux/install.sh
          chmod +x PyMORGAN/installer/assets/linux/uninstall.sh

      - name: Build Linux Package
        working-directory: PyMORGAN
        run: uv run python scripts/build_installer.py --platform linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pymorgan-suite-linux
          path: PyMORGAN/dist_installer/*

  release:
    name: Publish Release Assets
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/**/*
          generate_release_notes: true
